<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Sign in — Extracto</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{ --blue:#0A3D91; --ink:#0f1f33; --soft:#6b7a8c; --line:#e3e9f2; }
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
  html,body{height:100%}
  body{font-family:'Inter',system-ui,sans-serif;color:var(--ink);background:#fff;display:flex;flex-direction:column}
  .hero{background:linear-gradient(160deg,var(--blue),#08307a);color:#fff;
    padding:calc(56px + env(safe-area-inset-top,0px)) 28px 44px;border-radius:0 0 30px 30px}
  .word{font:800 38px 'Sora',sans-serif;letter-spacing:-.03em}
  .tag{margin-top:8px;font-size:15px;opacity:.85;line-height:1.5}
  .form{flex:1;padding:30px 24px 24px}
  h2{font:700 20px 'Sora',sans-serif;margin-bottom:4px}
  .hint{font-size:14px;color:var(--soft);margin-bottom:22px}
  label{display:block;font-size:13px;font-weight:600;color:var(--soft);margin:14px 0 7px}
  input{width:100%;height:52px;padding:0 16px;border:1.5px solid var(--line);border-radius:14px;
    font:500 16px 'Inter',sans-serif;background:#f7f9fc;color:var(--ink)}
  input:focus{outline:none;border-color:var(--blue);background:#fff}
  button{width:100%;height:54px;margin-top:26px;border:0;border-radius:14px;background:var(--blue);
    color:#fff;font:700 16px 'Sora',sans-serif;cursor:pointer}
  button:active{opacity:.9}
  button:disabled{opacity:.6}
  .err{display:none;margin-top:16px;padding:12px 14px;border-radius:12px;background:#fdeeec;color:#b42318;font-size:14px}
  .foot{text-align:center;font-size:12px;color:var(--soft);padding:14px 20px calc(16px + env(safe-area-inset-bottom,0px))}
  .foot b{color:var(--ink)}
  body.typing .foot{display:none}
</style>
</head>
<body>
  <div class="hero">
    <div class="word">Extracto</div>
    <div class="tag">Scan any document.<br>The AI does the rest.</div>
  </div>
  <div class="form">
    <h2>Sign in</h2>
    <div class="hint">Use your Eurobond account</div>
    <label for="email">Email address</label>
    <input type="email" id="email" placeholder="you@eurobond.co.in" autocomplete="username" inputmode="email">
    <label for="password">Password</label>
    <input type="password" id="password" placeholder="Your password" autocomplete="current-password">
    <div class="err" id="err"></div>
    <button id="loginBtn">Sign in</button>
  </div>
  <div class="foot">Copyright &copy; 2026 <b>Extracto</b> &middot; Developed and Designed by <b>Karthik G</b></div>

<script src="assets/app-config.js"></script>
<script>
var btn=document.getElementById('loginBtn'), err=document.getElementById('err');
if(window.getToken && window.getToken()) location.href='index.html';
async function doLogin(){
  err.style.display='none'; btn.disabled=true; btn.textContent='Signing in…';
  try{
    var r=await fetch(window.apiUrl('auth.php?action=login'),{method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({email:document.getElementById('email').value.trim(),password:document.getElementById('password').value})});
    var d=await r.json();
    if(d.ok){ if(d.token&&window.setToken) window.setToken(d.token); location.href='index.html'; return; }
    err.textContent=d.error||'Sign in failed'; err.style.display='block';
  }catch(e){ err.textContent='Cannot reach the server. Check your internet and try again.'; err.style.display='block'; }
  btn.disabled=false; btn.textContent='Sign in';
}
btn.onclick=doLogin;
document.getElementById('password').addEventListener('keydown',function(e){ if(e.key==='Enter') doLogin(); });
document.getElementById('email').addEventListener('keydown',function(e){ if(e.key==='Enter') document.getElementById('password').focus(); });
// keep the footer off the keyboard
['email','password'].forEach(function(id){
  var el=document.getElementById(id);
  el.addEventListener('focus',function(){ document.body.classList.add('typing'); });
  el.addEventListener('blur',function(){ setTimeout(function(){ document.body.classList.remove('typing'); },150); });
});
</script>
</body>
</html>
